services:
  - type: web
    name: antarctic-navigation-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_MODE
        value: demo
      - key: DEMO_MODE
        value: force
      - key: SEA_ICE_MODEL
        value: persistence
      - key: ICEBERG_MODEL
        value: persistence
      - key: ASSISTANT_PROVIDER
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: antarctic-navigation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
